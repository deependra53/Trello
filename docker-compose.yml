services:
  mongo:
    image: mongo:7
    container_name: trellox-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: trellox
      MONGO_INITDB_ROOT_PASSWORD: trellox
      MONGO_INITDB_DATABASE: trellox
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1
    container_name: trellox-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: trellox
      ME_CONFIG_MONGODB_ADMINPASSWORD: trellox
      ME_CONFIG_MONGODB_URL: mongodb://trellox:trellox@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: trellox-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trellox-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://trellox:trellox@mongo:27017/trellox?authSource=admin
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trellox-frontend
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    profiles:
      - full

volumes:
  mongo_data:
  redis_data:
